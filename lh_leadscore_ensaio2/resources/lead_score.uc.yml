# Schemas e volumes do Lead Score (o catálogo já existe: ${var.catalog})
resources:
  schemas:
    landing:
      catalog_name: ${var.catalog}
      name: landing
      comment: Porta de entrada dos CSVs exportados pelos sistemas de origem
    bronze:
      catalog_name: ${var.catalog}
      name: bronze
      comment: Dado como veio (Auto Loader)
    silver:
      catalog_name: ${var.catalog}
      name: silver
      comment: Limpo, deduplicado e unido
    gold:
      catalog_name: ${var.catalog}
      name: gold
      comment: IA + Lead Score + Fila do Dia (consumo do app e do Genie)

  volumes:
    raw:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing.name}
      name: raw
      volume_type: MANAGED
      comment: CSVs diários em leads/, empresas/ e historico/
    gabarito:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing.name}
      name: gabarito
      volume_type: MANAGED
      comment: Respostas esperadas para medir a acurácia da IA
