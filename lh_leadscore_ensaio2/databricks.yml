# This is a Declarative Automation Bundle definition for lh_leadscore_ensaio2.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: lh_leadscore_ensaio2
  uuid: fb04f7c6-73aa-4735-9027-58a6b09531d1

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-302cbd09-e572.cloud.databricks.com?w=1835011522269435
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-302cbd09-e572.cloud.databricks.com?w=1835011522269435
      # We explicitly deploy to /Workspace/Users/alerrandrofrederik@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/alerrandrofrederik@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: alerrandrofrederik@gmail.com
        level: CAN_MANAGE
