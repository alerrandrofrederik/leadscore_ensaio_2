# Lead Score · Declarative Automation Bundle
# Catálogo, schemas, volumes e o pipeline medalhão (Bronze → Silver → Gold com AI Functions).
# Docs: https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: lh_leadscore_ensaio2
  uuid: fb04f7c6-73aa-4735-9027-58a6b09531d1

include:
  - resources/*.yml

variables:
  catalog:
    description: Catálogo do Lead Score (criado uma vez, fora do bundle)
    default: lh_leadscore_ensaio2
  warehouse_id:
    description: SQL Warehouse usado pelo job de setup e pelo app
    default: a50e6a998ebe9440

targets:
  dev:
    # Sem `mode: development` de propósito: o catálogo é exclusivo deste projeto e os
    # schemas precisam ter os nomes do PRD (landing, bronze, silver, gold), sem prefixo.
    default: true
    workspace:
      host: https://dbc-302cbd09-e572.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      host: https://dbc-302cbd09-e572.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
